# Karjoo edge — the Cloudflare tunnel's origin (http://app:3000: this container
# carries the network alias "app") and, published on 127.0.0.1:3030, the host
# cron's way in. Everything goes to the app (container karjoo-app).
#
# Headers are the ones the old London proxy (deploy/karjoo-nginx.conf) sent.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 3000 default_server;
    server_name _;
    access_log off;

    # Docker's DNS, asked per request: the edge keeps working while the app is
    # recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream karjoo-app:3000;

    client_max_body_size 25m;

    location / {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }
}
